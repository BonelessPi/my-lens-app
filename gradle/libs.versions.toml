[versions]
agp                 = "9.2.0"
kotlin              = "2.3.20"
composeBom          = "2026.03.01"
coreKtx             = "1.18.0"
lifecycle           = "2.10.0"
activityCompose     = "1.13.0"
navigation          = "2.9.7"
exifinterface       = "1.4.2"
datastore           = "1.2.1"
camerax             = "1.6.0"
accompanist         = "0.37.3"
coil                = "2.7.0"
reorderable         = "3.0.0"
opencv              = "4.13.0"
itext7              = "9.6.0"

[libraries]
# Compose (versions managed by BOM — no version.ref needed)
compose-bom                     = { group = "androidx.compose",          name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-tooling              = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# AndroidX
core-ktx                  = { group = "androidx.core",        name = "core-ktx",                  version.ref = "coreKtx" }
lifecycle-runtime-ktx     = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose          = { group = "androidx.activity",    name = "activity-compose",          version.ref = "activityCompose" }
navigation-compose        = { group = "androidx.navigation",  name = "navigation-compose",        version.ref = "navigation" }
exifinterface             = { group = "androidx.exifinterface", name = "exifinterface",            version.ref = "exifinterface" }
datastore-preferences     = { group = "androidx.datastore",   name = "datastore-preferences",     version.ref = "datastore" }

# CameraX
camera-camera2  = { group = "androidx.camera", name = "camera-camera2",  version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view     = { group = "androidx.camera", name = "camera-view",     version.ref = "camerax" }

# Third-party
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
coil-compose            = { group = "io.coil-kt",             name = "coil-compose",            version.ref = "coil" }
reorderable             = { group = "sh.calvin.reorderable",  name = "reorderable",             version.ref = "reorderable" }
opencv                  = { group = "org.opencv",             name = "opencv",                  version.ref = "opencv" }
itext7-core             = { group = "com.itextpdf",           name = "itext7-core",             version.ref = "itext7" }

[bundles]
compose   = ["compose-ui", "compose-ui-tooling-preview", "compose-material3", "compose-material-icons-extended"]
lifecycle = ["lifecycle-runtime-ktx", "lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]
camerax   = ["camera-camera2", "camera-lifecycle", "camera-view"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }